[package]
name = "typer"
version = "0.1.0"
edition = "2024"
description = "軽量マークアップ文書作成アプリ (MVP)"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
rfd = "0.17.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
