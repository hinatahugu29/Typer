[package]
name = "typer"
version = "0.1.0"
edition = "2024"
description = "軽量マークアップ文書作成アプリ (MVP)"
repository = "https://github.com/hinatahugu29/Typer"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-syntax = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
rfd = "0.17.2"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
roxmltree = "0.21.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
